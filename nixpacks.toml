[phases.setup]
packages = ["dotnet-sdk_8"]

[phases.install]
commands = [
    "dotnet --info",
    "dotnet restore src/Ecommerce.Web/Ecommerce.Web.csproj --no-cache"
]

[phases.build]
commands = [
    "dotnet build src/Ecommerce.Web/Ecommerce.Web.csproj -c Release --no-restore",
    "dotnet publish src/Ecommerce.Web/Ecommerce.Web.csproj -c Release -o out --no-build"
]

[start]
cmd = "dotnet out/Ecommerce.Web.dll"